<header>
  <!-- your full header code -->
  <div class="header-inner">

    <div class="header-left">
      <button class="hdr-btn" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="7"  x2="21" y2="7"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
        <span class="hdr-btn-label">Menu</span>
      </button>

      <a href="/" class="logo-wrap">
        <div class="logo-icon">
          <img src="https://rutunjay651.github.io/resources/logo/spp.png"
               onerror="this.onerror=null;this.src='https://placehold.co/52x52/4ade80/ffffff?text=SPP';"
               alt="Shrikant Paper Products"/>
        </div>
        <img src="https://rutunjay651.github.io/resources/logo/spp3.png"
             alt="Shrikant Paper Products"
             style="height:53px;width:auto;object-fit:contain;position:relative;top:-0px;"
             onerror="this.onerror=null;this.style.display='none';"/>
      </a>
    </div>

    <div class="header-actions">
      <button class="hdr-btn" id="openSearchBtn" title="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="hdr-btn-label">Search</span>
      </button>
      <a href="#" class="hdr-btn" title="Account">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span class="hdr-btn-label">Account</span>
      </a>
      <a href="/" class="hdr-btn" title="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="hdr-btn-label">Wishlist</span>
      </a>
      <div class="cart-wrap">
        <a href="#" class="hdr-btn" onclick="openCart()" title="Cart">
          <svg class="cart-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="hdr-btn-label">Cart</span>
        </a>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>
  </div>
</header>

<!-- search popup code -->
<div id="searchOverlay" class="search-overlay">
  <div class="search-popup">
    <div class="search-popup-header">
      <input type="text" id="searchPopupInput" class="search-popup-input" placeholder="Search by name, code, price, category…" autocomplete="off"/>
      <div class="search-popup-close" id="closeSearchPopup">&times;</div>
    </div>
    <div id="searchPopupDropdown"></div>
  </div>
</div>
